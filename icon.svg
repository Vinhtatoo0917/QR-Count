<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background bo góc chuẩn app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Icon QR Code màu trắng -->
  <g fill="#ffffff">
    <!-- Góc trên trái -->
    <rect x="96" y="96" width="130" height="130" rx="20"/>
    <rect x="122" y="122" width="78" height="78" rx="10" fill="#2563eb"/>
    <rect x="142" y="142" width="38" height="38" rx="6" fill="#ffffff"/>

    <!-- Góc trên phải -->
    <rect x="286" y="96" width="130" height="130" rx="20"/>
    <rect x="312" y="122" width="78" height="78" rx="10" fill="#2563eb"/>
    <rect x="332" y="142" width="38" height="38" rx="6" fill="#ffffff"/>

    <!-- Góc dưới trái -->
    <rect x="96" y="286" width="130" height="130" rx="20"/>
    <rect x="122" y="312" width="78" height="78" rx="10" fill="#2563eb"/>
    <rect x="142" y="332" width="38" height="38" rx="6" fill="#ffffff"/>

    <!-- Các khối QR trang trí và mắt quét ở góc dưới phải -->
    <rect x="286" y="286" width="55" height="55" rx="12"/>
    <rect x="361" y="286" width="55" height="55" rx="12"/>
    <rect x="286" y="361" width="55" height="55" rx="12"/>
    <rect x="361" y="361" width="55" height="55" rx="12"/>
    
    <!-- Điểm nhấn trung tâm -->
    <rect x="236" y="236" width="40" height="40" rx="10"/>
  </g>
</svg>
